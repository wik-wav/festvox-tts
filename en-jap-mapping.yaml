  - {symbol: p, type: stop}
  #syllabic /n/, used for Japanese or expressive pronunciation, has 1 alt which is a nasalized schwa vowel
  - {symbol: nn, type: vowel}     #ん
  #syllabic /m/, used for Japanese or expressive pronunciation
  - {symbol: mm, type: vowel}     #んm
  #syllabic /ng/, used for Japanese only, eg. in 人間 [n i nng e n]
  - {symbol: nng, type: vowel}    #んng
  #nasalised /ax/, used for Japanese only, eg. in 原因 [g e xn i xn]
  - {symbol: xn, type: vowel}     #んn
  #Japanese support vowels and consonants
  - {symbol: a, type: vowel}
  - {symbol: i, type: vowel}
  - {symbol: u, type: vowel}
  - {symbol: e, type: vowel}
  - {symbol: o, type: vowel}
  - {symbol: ts, type: affricate}
  - {symbol: dz, type: affricate}
  - {symbol: h, type: fricative}
