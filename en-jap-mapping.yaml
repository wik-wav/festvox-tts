  - {symbol: uh, type: vowel}
  - {symbol: uw, type: vowel}
  - {symbol: v, type: fricative}
  - {symbol: w, type: semivowel}
  - {symbol: y, type: semivowel}
  - {symbol: z, type: fricative}
  - {symbol: zh, type: fricative}
  #inhale (breath)
  - {symbol: inh, type: vowel}
  #silence, used before breaths and in some special cases, the sample is simply -inf
  - {symbol: sil, type: consonant}
  #exhalation, use for expressive passages
  - {symbol: exh, type: consonant}
  #held stop (eg in. cat [cl] told)
  - {symbol: cl, type: stop}
